<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GraphRAG Viz · 情报分析图谱</title>

<!-- CDN: Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- CDN: Cytoscape.js -->
<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
<!-- CDN: 字体 -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg: #000000;
    --panel: rgba(0, 0, 0, 0.88);
    --panel-solid: #050505;
    --border: #2a2a2a;
    --border-strong: #4a4a4a;
    --text: #e8e8e8;
    --text-dim: #8a8a8a;
    --accent: #ffffff;
    --accent2: #a3a3a3;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "JetBrains Mono", "Noto Serif SC", monospace;
  }
  .mono { font-family: "JetBrains Mono", monospace; }

  /* 画布背景：纯黑 + 细网格线 */
  #cy {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 50% 40%, rgba(255, 255, 255, 0.025), transparent 60%),
      linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
      #000;
    background-size: 100% 100%, 40px 40px, 40px 40px, 100% 100%;
  }

  /* 顶部工具栏 */
  #toolbar {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: rgba(0, 0, 0, 0.92);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(8px);
  }
  .brand-mark {
    width: 34px; height: 34px;
    border-radius: 6px;
    display: grid; place-items: center;
    border: 1.5px solid #fff;
    color: #fff;
    font-weight: 700;
    font-size: 16px;
    background: transparent;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: 4px;
    font-size: 12.5px;
    font-weight: 500;
    font-family: "JetBrains Mono", monospace;
    border: 1px solid var(--border-strong);
    background: transparent;
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
    letter-spacing: 0.3px;
  }
  .btn:hover { border-color: #fff; color: #fff; background: rgba(255, 255, 255, 0.04); }
  .btn-primary { border-color: #fff; color: #000; background: #fff; }
  .btn-primary:hover { background: #d9d9d9; border-color: #d9d9d9; color: #000; }
  .btn-accent { border-color: #fb923c; color: #fb923c; background: transparent; }
  .btn-accent:hover { background: rgba(251, 146, 60, 0.08); color: #fb923c; border-color: #fb923c; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* 图例 */
  #legend {
    position: absolute;
    left: 16px; bottom: 16px;
    z-index: 20;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 14px;
    font-size: 12px;
    backdrop-filter: blur(6px);
  }
  .legend-item { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
  .legend-dot {
    width: 12px; height: 12px;
    border-radius: 2px;
    border: 1.5px solid;
    background: transparent;
  }

  /* 右侧抽屉 */
  #drawer {
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 380px;
    z-index: 40;
    background: var(--panel);
    border-left: 1px solid var(--border);
    backdrop-filter: blur(10px);
    transform: translateX(100%);
    transition: transform 0.25s ease;
    display: flex;
    flex-direction: column;
  }
  #drawer.open { transform: translateX(0); }

  /* 右键菜单 */
  #ctxmenu {
    position: absolute;
    z-index: 60;
    min-width: 200px;
    background: var(--panel-solid);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.7);
    padding: 6px;
    display: none;
  }
  .ctx-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px;
    border-radius: 4px;
    font-size: 12.5px;
    cursor: pointer;
    color: var(--text);
  }
  .ctx-item:hover { background: rgba(255, 255, 255, 0.05); color: #fff; }
  .ctx-item.danger:hover { background: rgba(244, 63, 94, 0.1); color: #f43f5e; }
  .ctx-sep { height: 1px; background: var(--border); margin: 5px 8px; }

  /* 模态框 */
  .modal-mask {
    position: absolute; inset: 0;
    z-index: 70;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center; justify-content: center;
  }
  .modal-mask.open { display: flex; }
  .modal {
    width: 520px; max-width: 92vw;
    max-height: 86vh; overflow-y: auto;
    background: var(--panel-solid);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    padding: 22px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8);
  }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 11.5px; color: var(--text-dim); margin-bottom: 5px; letter-spacing: 0.5px; }
  .field input, .field select, .field textarea {
    width: 100%;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 10px;
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    outline: none;
  }
  .field select {
    background: #050505;
  }
  .field select option {
    background: #050505;
    color: #e8e8e8;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    border-color: #fff;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.2);
  }
  .field textarea { resize: vertical; min-height: 70px; }

  /* RAG 上下文底部面板 */
  #ragpanel {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    z-index: 50;
    max-height: 40vh;
    background: var(--panel);
    border-top: 1px solid var(--border);
    backdrop-filter: blur(10px);
    transform: translateY(100%);
    transition: transform 0.25s ease;
    display: flex;
    flex-direction: column;
  }
  #ragpanel.open { transform: translateY(0); }
  #ragtext {
    overflow-y: auto;
    padding: 14px 18px;
    font-size: 12.5px;
    line-height: 1.7;
    white-space: pre-wrap;
    color: #c8c8c8;
  }

  /* Toast */
  #toast {
    position: absolute;
    top: 64px; left: 50%;
    transform: translateX(-50%) translateY(-20px);
    z-index: 90;
    background: var(--panel-solid);
    border: 1px solid #fff;
    color: var(--text);
    padding: 9px 18px;
    border-radius: 4px;
    font-size: 12.5px;
    opacity: 0;
    transition: all 0.25s ease;
    pointer-events: none;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .kv-row { display: flex; gap: 8px; padding: 6px 0; border-bottom: 1px dashed rgba(255, 255, 255, 0.12); font-size: 12.5px; }
  .kv-key { color: var(--text-dim); min-width: 90px; flex-shrink: 0; }
  .kv-val { color: var(--text); word-break: break-all; }
  .type-badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

<!-- 欢迎界面：画板选择 -->
<div class="modal-mask open" id="welcome">
  <div class="modal" style="width: 660px">
    <div class="flex items-center gap-3 mb-1">
      <div class="brand-mark">情</div>
      <div>
        <div class="text-xl font-bold">情报分析图谱</div>
        <div class="text-[12px] text-slate-400">选择或创建画板，开始情报关系分析</div>
      </div>
    </div>
    <div class="flex gap-2 mt-5 mb-5">
      <input id="new-board-name" placeholder="新画板名称，如：APT29 调查"
             class="flex-1 bg-transparent border border-slate-700 rounded px-3 py-2 text-[13px] text-slate-200 outline-none focus:border-white" />
      <button class="btn btn-primary" onclick="createBoard()">＋ 创建新画板</button>
    </div>
    <div class="text-[11px] tracking-widest text-slate-400 mb-2">已有画板</div>
    <div id="boards-list" class="space-y-2 max-h-[52vh] overflow-y-auto pr-1"></div>
  </div>
</div>

<!-- 顶部工具栏 -->
<div id="toolbar">
  <div class="brand-mark">情</div>
  <div class="mr-2">
    <div class="text-[15px] font-bold tracking-wide">GraphRAG Viz</div>
    <div class="text-[11px] text-slate-400">情报分析图谱 · 关系挖掘与索引导出</div>
  </div>
  <div class="flex-1"></div>
  <button class="btn" id="btn-boards" title="切换画板">📁 <span id="board-name">—</span></button>
  <button class="btn" id="btn-fit" title="自适应居中">⤢ 居中</button>
  <button class="btn" id="btn-rag" title="生成 GraphRAG 检索上下文">🧠 RAG 上下文</button>
  <button class="btn" id="btn-types">⚙ 类型管理</button>
  <button class="btn" id="btn-add-node">＋ 添加实体</button>
  <button class="btn" id="btn-add-edge">⇄ 添加关系</button>
  <button class="btn btn-accent" id="btn-export" title="下载 GraphRAG 索引 JSON">⬇ 导出 GraphRAG 索引</button>
  <button class="btn btn-primary" id="btn-save" title="持久化写回当前画板文件">💾 保存到本地</button>
</div>

<!-- 图例 -->
<div id="legend">
  <div class="text-[11px] text-slate-400 mb-1 tracking-widest">实体类型图例</div>
  <div id="legend-body"></div>
</div>

<!-- 画布 -->
<div id="cy"></div>

<!-- 右侧抽屉 -->
<div id="drawer">
  <div class="flex items-center justify-between px-5 py-4 border-b border-slate-800">
    <div class="text-sm font-bold tracking-widest text-slate-300">实体详情</div>
    <div class="flex items-center gap-2">
      <button id="drawer-edit" class="btn !py-1 !px-3 text-[12px]">✎ 编辑</button>
      <button id="drawer-close" class="text-slate-500 hover:text-slate-200 text-lg leading-none">✕</button>
    </div>
  </div>
  <div id="drawer-body" class="flex-1 overflow-y-auto px-5 py-4"></div>
</div>

<!-- 右键菜单 -->
<div id="ctxmenu"></div>

<!-- RAG 上下文面板 -->
<div id="ragpanel">
  <div class="flex items-center justify-between px-5 py-3 border-b border-slate-800">
    <div class="text-sm font-bold tracking-widest text-slate-300">🧠 GraphRAG 检索上下文 <span id="rag-title" class="text-cyan-400"></span></div>
    <div class="flex gap-2">
      <button id="rag-copy" class="btn !py-1 !px-3 text-[12px]">复制</button>
      <button id="rag-close" class="text-slate-500 hover:text-slate-200 text-lg leading-none">✕</button>
    </div>
  </div>
  <div id="ragtext" class="mono"></div>
</div>

<!-- 添加实体模态框 -->
<div class="modal-mask" id="modal-node">
  <div class="modal">
    <div class="text-lg font-bold mb-4" id="modal-node-title">＋ 添加实体</div>
    <div class="field">
      <label>ID（可选，留空自动生成，如 ent_xxx）</label>
      <input id="node-id" placeholder="ent_apt29" class="mono" />
    </div>
    <div class="field">
      <label>名称 *</label>
      <input id="node-name" placeholder="如：APT29" />
    </div>
    <div class="field">
      <label>类型 *</label>
      <select id="node-type"></select>
    </div>
    <div class="field">
      <label>描述（GraphRAG Entity Description，用于生成 Embedding）</label>
      <textarea id="node-desc" placeholder="自然语言描述该实体……"></textarea>
    </div>
    <div class="field">
      <label>属性（JSON 对象，可选）</label>
      <textarea id="node-props" class="mono" placeholder='{"alias": ["Cozy Bear"], "attribution": "俄罗斯 SVR"}'></textarea>
    </div>
    <div class="field">
      <label>来源片段（每行一个，可选）</label>
      <textarea id="node-chunks" class="mono" placeholder="report_001: 微软威胁情报中心 APT29 活动报告"></textarea>
    </div>
    <div class="flex justify-end gap-2 mt-4">
      <button class="btn" onclick="closeModal('modal-node')">取消</button>
      <button class="btn btn-primary" onclick="submitNode()">确认添加</button>
    </div>
  </div>
</div>

<!-- 添加关系模态框 -->
<div class="modal-mask" id="modal-edge">
  <div class="modal">
    <div class="text-lg font-bold mb-4">⇄ 添加关系</div>
    <div class="field">
      <label>ID（可选，留空自动生成）</label>
      <input id="edge-id" placeholder="rel_xxx" class="mono" />
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div class="field">
        <label>源节点 *</label>
        <select id="edge-source"></select>
      </div>
      <div class="field">
        <label>目标节点 *</label>
        <select id="edge-target"></select>
      </div>
    </div>
    <div class="field">
      <label>关系动词 *（大写下划线）</label>
      <input id="edge-relation" placeholder="如：CONTROLS / USES / RESOLVES_TO / EXPLOITS" class="mono" />
    </div>
    <div class="field">
      <label>描述（关系语义，用于 RAG 边上下文）</label>
      <textarea id="edge-desc" placeholder="描述这段关系的语义……"></textarea>
    </div>
    <div class="field">
      <label>权重（0.0 ~ 1.0）</label>
      <input id="edge-weight" type="number" min="0" max="1" step="0.05" value="0.8" class="mono" />
    </div>
    <div class="flex justify-end gap-2 mt-4">
      <button class="btn" onclick="closeModal('modal-edge')">取消</button>
      <button class="btn btn-primary" onclick="submitEdge()">确认添加</button>
    </div>
  </div>
</div>

<!-- 类型管理模态框 -->
<div class="modal-mask" id="modal-types">
  <div class="modal">
    <div class="text-lg font-bold mb-4">⚙ 实体类型管理</div>
    <div id="types-list" class="space-y-2 mb-4"></div>
    <div class="border-t border-slate-800 pt-4">
      <div class="text-sm font-bold mb-3 text-white">＋ 自定义新类型</div>
      <div class="grid grid-cols-2 gap-3">
        <div class="field">
          <label>类型名 *（英文标识）</label>
          <input id="type-name" class="mono" placeholder="Person" />
        </div>
        <div class="field">
          <label>显示标签</label>
          <input id="type-label" placeholder="人物" />
        </div>
        <div class="field">
          <label>颜色</label>
          <input id="type-color" type="color" value="#22d3ee" class="!h-10 !p-1" />
        </div>
        <div class="field">
          <label>形状</label>
          <select id="type-shape">
            <option value="ellipse">ellipse 圆形</option>
            <option value="round-rectangle">round-rectangle 圆角方形</option>
            <option value="rectangle">rectangle 方形</option>
            <option value="diamond">diamond 菱形</option>
            <option value="hexagon">hexagon 六边形</option>
            <option value="octagon">octagon 八边形</option>
            <option value="star">star 星形</option>
            <option value="triangle">triangle 三角形</option>
            <option value="pentagon">pentagon 五边形</option>
            <option value="round-tag">round-tag 圆标签</option>
            <option value="round-hexagon">round-hexagon 圆六边形</option>
            <option value="barrel">barrel 桶形</option>
            <option value="rhombus">rhombus 菱形</option>
            <option value="tag">tag 标签</option>
            <option value="plus">plus 加号</option>
            <option value="cross">cross 叉号</option>
          </select>
        </div>
      </div>
      <div class="flex justify-end gap-2 mt-2">
        <button class="btn" onclick="closeModal('modal-types')">关闭</button>
        <button class="btn btn-primary" onclick="submitType()">添加类型</button>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
/* ============================================================
 * 常量与状态
 * ============================================================ */
const TYPES = {}; // 从后端 /api/types 动态加载（内置 + 用户自定义）
const DEFAULT_TYPE = { color: '#64748b', shape: 'ellipse', label: '未知' };

let selectedNodeId = null;   // 当前抽屉展示的节点
let ctxNodeId = null;        // 右键菜单对应的节点
let editingNodeId = null;    // 编辑实体模式下的节点 id

/* ============================================================
 * Cytoscape 初始化
 * ============================================================ */
const cy = cytoscape({
  container: document.getElementById('cy'),
  elements: [],
  style: [
    {
      selector: 'node',
      style: {
        'background-color': 'transparent',
        'shape': (ele) => (TYPES[ele.data('type')] || DEFAULT_TYPE).shape,
        'label': 'data(name)',
        'color': '#e8e8e8',
        'font-size': 11,
        'font-family': '"JetBrains Mono", monospace',
        'font-weight': 500,
        'text-valign': 'bottom',
        'text-margin-y': 7,
        'text-wrap': 'wrap',
        'text-max-width': 130,
        'text-background-color': '#000',
        'text-background-opacity': 0.85,
        'text-background-padding': 3,
        'width': 44,
        'height': 44,
        'border-width': 2,
        'border-color': (ele) => (TYPES[ele.data('type')] || DEFAULT_TYPE).color,
        'overlay-opacity': 0,
      },
    },
    {
      selector: 'edge',
      style: {
        'width': 1.5,
        'line-color': '#3a3a3a',
        'target-arrow-color': '#5a5a5a',
        'target-arrow-shape': 'triangle',
        'curve-style': 'bezier',
        'label': 'data(relation)',
        'font-size': 8.5,
        'font-family': '"JetBrains Mono", monospace',
        'color': '#8a8a8a',
        'text-background-color': '#000',
        'text-background-opacity': 0.85,
        'text-background-padding': 2,
        'text-rotation': 'autorotate',
        'overlay-opacity': 0,
      },
    },
    {
      selector: 'node:selected',
      style: {
        'border-width': 3,
        'border-color': '#ffffff',
        'overlay-opacity': 0.1,
        'overlay-color': '#ffffff',
      },
    },
    {
      selector: 'edge:selected',
      style: { 'line-color': '#ffffff', 'target-arrow-color': '#ffffff' },
    },
  ],
  layout: { name: 'preset' },
  wheelSensitivity: 0.2,
  minZoom: 0.08,
  maxZoom: 3,
  boxSelectionEnabled: false,
});

const COSE_LAYOUT = {
  name: 'cose',
  animate: true,
  animationDuration: 600,
  padding: 60,
  nodeRepulsion: 9000,
  idealEdgeLength: 130,
  edgeElasticity: 120,
  gravity: 0.35,
  randomize: true,
  fit: true,
};

/* ============================================================
 * 数据加载与渲染
 * ============================================================ */
async function loadGraph() {
  const res = await fetch('/api/graph');
  const data = await res.json();
  renderGraph(data);
}

/* ============================================================
 * 画板管理（独立文件管理）
 * ============================================================ */
async function loadBoards() {
  try {
    const res = await fetch('/api/boards');
    const data = await res.json();
    renderBoards(data.boards);
    document.getElementById('board-name').textContent = data.current || '—';
  } catch (err) {
    toast('加载画板列表失败：' + err.message, true);
  }
}

function renderBoards(boards) {
  const list = document.getElementById('boards-list');
  if (boards.length === 0) {
    list.innerHTML = '<div class="text-slate-500 text-[13px] py-6 text-center">暂无画板，请在上方创建</div>';
    return;
  }
  list.innerHTML = boards.map((b) => `
    <div class="flex items-center gap-3 bg-slate-900/40 border border-slate-800 rounded-lg px-4 py-3 cursor-pointer hover:border-cyan-500/50 transition-colors"
         onclick="openBoard('${b.name}')">
      <div class="w-9 h-9 rounded-lg grid place-items-center bg-cyan-500/10 text-cyan-400 text-lg">📁</div>
      <div class="flex-1 min-w-0">
        <div class="font-semibold text-[14px] truncate">${b.name}</div>
        <div class="text-[11px] text-slate-500">${b.nodes} 节点 · ${b.edges} 关系 · 更新于 ${b.updated_at}</div>
      </div>
      <button class="btn !py-1 !px-2 text-[11px]" onclick="event.stopPropagation(); renameBoard('${b.name}')">重命名</button>
      <button class="btn !py-1 !px-2 text-[11px] text-rose-400" onclick="event.stopPropagation(); deleteBoard('${b.name}')">删除</button>
    </div>`).join('');
}

async function openBoard(name) {
  try {
    const res = await fetch('/api/boards/open', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },

/* ============================================================
 * 拖拽连线：长按节点拖动拖出箭头，松手到目标节点创建关系
 * ============================================================ */
let dragState = null;      // 拖拽连线状态
let lastMousePos = null;   // 最近一次鼠标位置（画布坐标）

cy.on('mousemove', (evt) => {
  lastMousePos = evt.position;
  if (dragState && dragState.mode === 'link') {
    cy.getElementById(dragState.tempNodeId).position(evt.position);
  }
});

cy.on('grabon', 'node', (evt) => {
  // 清理可能残留的临时元素（异常中断时）
  cy.getElementById('__drag_edge__').remove();
  cy.getElementById('__drag_target__').remove();
  const node = evt.target;
  dragState = {
    sourceId: node.id(),
    startTime: Date.now(),
    initialPos: { ...node.position() },
    mode: 'move',
  };
});

cy.on('drag', 'node', (evt) => {
  if (!dragState || dragState.sourceId !== evt.target.id()) return;
  const node = evt.target;
  if (dragState.mode === 'move' && Date.now() - dragState.startTime > 300) {
    // 长按超过阈值 → 进入连线模式
    dragState.mode = 'link';
    const tempNodeId = '__drag_target__';
    const tempEdgeId = '__drag_edge__';
    cy.add({ data: { id: tempNodeId, name: '', type: '__temp__' } });
    cy.getElementById(tempNodeId).style({
      'background-opacity': 0,
      'border-opacity': 0,
      'label': '',
      'width': 1,
      'height': 1,
      'overlay-opacity': 0,
    });
    cy.add({ data: { id: tempEdgeId, source: dragState.sourceId, target: tempNodeId, relation: '' } });
    cy.getElementById(tempEdgeId).style({
      'line-style': 'dashed',
      'line-color': '#ffffff',
      'width': 2,
      'target-arrow-shape': 'triangle',
      'target-arrow-color': '#ffffff',
      'label': '',
      'overlay-opacity': 0,
    });
    dragState.tempNodeId = tempNodeId;
    dragState.tempEdgeId = tempEdgeId;
    toast('拖动到目标节点松手以创建关系');
  }
  if (dragState.mode === 'link') {
    // 锁定源节点位置，避免被拖动
    node.position(dragState.initialPos);
  }
});

cy.on('free', 'node', (evt) => {
  if (!dragState || dragState.sourceId !== evt.target.id()) return;
  const node = evt.target;
  if (dragState.mode === 'link') {
    // 清理临时元素
    if (dragState.tempEdgeId) cy.getElementById(dragState.tempEdgeId).remove();
    if (dragState.tempNodeId) cy.getElementById(dragState.tempNodeId).remove();
    node.position(dragState.initialPos);
    // 查找鼠标位置的目标节点（遍历节点包围盒判断）
    const pos = lastMousePos || node.position();
    let target = null;
    cy.nodes().forEach((n) => {
      if (n.id() === dragState.sourceId || n.id().startsWith('__')) return;
      const bb = n.boundingBox();
      if (pos.x >= bb.x1 && pos.x <= bb.x2 && pos.y >= bb.y1 && pos.y <= bb.y2) {
        target = n;
      }
    });
    if (target) {
      openEdgeDialog(dragState.sourceId, target.id());
    }
  }
  dragState = null;
});

/* 展开邻居：调用后端 1 跳展开，合并追加到画布 */
async function expandNode(nodeId) {
  hideCtxMenu();
  try {
    const res = await fetch(`/api/expand/${nodeId}`);
    if (!res.ok) throw new Error('展开失败');
    const sub = await res.json();
    const existingNodes = new Set(cy.nodes().map((n) => n.id()));
    const existingEdges = new Set(cy.edges().map((e) => e.id()));
    const newElems = [];
    sub.nodes.forEach((n) => {
      if (!existingNodes.has(n.id)) newElems.push({ data: n });
    });
    sub.edges.forEach((e) => {
      if (!existingEdges.has(e.id)) newElems.push({ data: e });
    });
    if (newElems.length === 0) {
      toast('该节点已无未展示的邻居');
      return;
    }
    cy.add(newElems);
    cy.layout(COSE_LAYOUT).run();
    toast(`已展开 ${newElems.length} 个新元素`);
  } catch (err) {
    toast('展开失败：' + err.message, true);
  }
}

/* 删除节点：内存 + 画布同步移除 */
async function removeNode(nodeId) {
  hideCtxMenu();
  if (!confirm(`确定删除节点「${cy.getElementById(nodeId).data('name')}」及其所有关联关系？`)) return;
  try {
    const res = await fetch(`/api/node/${nodeId}`, { method: 'DELETE' });
    if (!res.ok) throw new Error('删除失败');
    cy.getElementById(nodeId).remove();
    cy.edges().filter((e) => e.data('source') === nodeId || e.data('target') === nodeId).remove();
    if (selectedNodeId === nodeId) hideDrawer();
    toast('节点已从内存与画布移除（保存后落盘）');
  } catch (err) {
    toast('删除失败：' + err.message, true);
  }
}

      const other = cy.getElementById(otherId).data();
      rels.push({
        relation: d.relation,
        otherName: other.name || otherId,
        otherType: other.type || '?',

  body.innerHTML = `
    <div class="flex items-center gap-3 mb-4">

           style="background:${ts.color}22; color:${ts.color}; border:1px solid ${ts.color}55">
        ${nodeData.name.slice(0, 1)}

      <div>
        <div class="text-xl font-bold">${nodeData.name}</div>
        <span class="type-badge" style="background:${ts.color}22; color:${ts.color}; border:1px solid ${ts.color}55">
          ${nodeData.type} · ${ts.label}
        </span>
      </div>
    </div>

    <div class="text-[11px] tracking-widest text-slate-400 mb-1 mt-5">GRAPH RAG 描述（Entity Description）</div>
    <div class="text-[13px] leading-relaxed text-slate-200 bg-slate-900/60 border border-slate-800 rounded-lg p-3">
      ${nodeData.description || '（无描述）'}
    </div>

    <div class="text-[11px] tracking-widest text-slate-400 mb-1 mt-5">结构化属性（Properties）</div>
    <div class="bg-slate-900/40 border border-slate-800 rounded-lg px-3 py-1">
      ${Object.keys(props).length === 0
        ? '<div class="py-2 text-slate-500 text-[12px]">（无属性）</div>'
        : Object.entries(props).map(([k, v]) => `
            <div class="kv-row">
              <div class="kv-key mono">${k}</div>
              <div class="kv-val">${typeof v === 'object' ? JSON.stringify(v) : v}</div>
            </div>`).join('')}
    </div>

    <div class="text-[11px] tracking-widest text-slate-400 mb-1 mt-5">关联关系（${rels.length}）</div>
    <div class="space-y-2">
      ${rels.length === 0
        ? '<div class="text-slate-500 text-[12px]">（暂无关联关系）</div>'
        : rels.map((r) => `
            <div class="bg-slate-900/40 border border-slate-800 rounded-lg p-2.5">
              <div class="flex items-center gap-2 text-[12px]">
                <span class="mono text-cyan-400 font-bold">${r.relation}</span>
                <span class="text-slate-400">${r.direction}</span>
                <span class="font-semibold">${r.otherName}</span>
                <span class="text-slate-500 text-[10px]">${r.otherType}</span>
                <span class="ml-auto mono text-[10px] text-slate-500">w=${r.weight}</span>
              </div>
              ${r.desc ? `<div class="text-[11px] text-slate-400 mt-1">${r.desc}</div>` : ''}
            </div>`).join('')}

    <div class="text-[11px] tracking-widest text-slate-400 mb-1 mt-5">文本溯源（Source Chunks）</div>
    <div class="space-y-1.5">

async function submitNode() {
  const idInput = document.getElementById('node-id');
  const id = idInput.value.trim();
  const name = document.getElementById('node-name').value.trim();
  const type = document.getElementById('node-type').value;
  const desc = document.getElementById('node-desc').value.trim();
  const propsRaw = document.getElementById('node-props').value.trim();
  const chunksRaw = document.getElementById('node-chunks').value.trim();

  if (!name) { toast('请填写实体名称', true); return; }

  let properties = {};
  if (propsRaw) {
    try { properties = JSON.parse(propsRaw); }
    catch { toast('属性不是合法 JSON', true); return; }
  }
  const source_chunks = chunksRaw ? chunksRaw.split('\n').map((s) => s.trim()).filter(Boolean) : [];
  const nodeId = editingNodeId || id || `ent_${Date.now().toString(36)}`;

  try {
    const res = await fetch('/api/node', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: nodeId, name, type, description: desc, properties, source_chunks }),
    });
    if (!res.ok) throw new Error('保存失败');
    closeModal('modal-node');
    idInput.disabled = false;
    idInput.value = '';
    document.getElementById('node-name').value = '';
    document.getElementById('node-desc').value = '';
    document.getElementById('node-props').value = '';
    document.getElementById('node-chunks').value = '';
    document.getElementById('modal-node-title').textContent = '＋ 添加实体';
    const wasEditing = editingNodeId !== null;
    editingNodeId = null;
    await loadGraph();
    toast(wasEditing ? `已更新实体「${name}」` : `已添加实体「${name}」`);
  } catch (err) {
    toast('保存实体失败：' + err.message, true);
  }
}

async function submitEdge() {
  const id = document.getElementById('edge-id').value.trim();
  const source = document.getElementById('edge-source').value;
  const target = document.getElementById('edge-target').value;
  const relation = document.getElementById('edge-relation').value.trim().toUpperCase();
  const desc = document.getElementById('edge-desc').value.trim();
  const weight = parseFloat(document.getElementById('edge-weight').value) || 0.5;

  if (!source || !target) { toast('请选择源节点与目标节点', true); return; }
  if (!relation) { toast('请填写关系动词', true); return; }
  if (source === target) { toast('源节点与目标节点不能相同', true); return; }
  const edgeId = id || `rel_${Date.now().toString(36)}`;

  try {
    const res = await fetch('/api/edge', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: edgeId, source, target, relation, description: desc, weight }),
    });
    if (!res.ok) throw new Error('添加失败');
    closeModal('modal-edge');
    document.getElementById('edge-id').value = '';
    document.getElementById('edge-relation').value = '';
    document.getElementById('edge-desc').value = '';
    await loadGraph();
    toast(`已添加关系 ${relation}`);
  } catch (err) {
    toast('添加关系失败：' + err.message, true);
  }
}

async function exportGraphRag() {
  try {
    const res = await fetch('/api/graph');
    const data = await res.json();
    const payload = {
      graph_name: '情报分析图谱',
      exported_at: new Date().toISOString(),
      entities: data.nodes,
      relationships: data.edges,
      graphrag_compat: {
        ms_graphrag: 'entities 对应 entity 表（id/name/type/description），relationships 对应 relationship 表（source/target/relation/description/weight），source_chunks 对应 text_unit 关联，可直接作为 GraphRAG 索引输入。',
        llamaindex: '每条 relationship 可转换为 (head=source, relation, tail=target) 三元组，配合 entity.description 构建 KnowledgeGraphIndex。',
      },
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'graphrag_index.json';
    a.click();
    URL.revokeObjectURL(url);
    toast('已导出 GraphRAG 索引 JSON');
  } catch (err) {
    toast('导出失败：' + err.message, true);
  }
}

    .join('');
}

async function submitType() {
  const name = document.getElementById('type-name').value.trim();
  const label = document.getElementById('type-label').value.trim();
  const color = document.getElementById('type-color').value;
  const shape = document.getElementById('type-shape').value;
  if (!name) { toast('请填写类型名', true); return; }
  try {
    const res = await fetch('/api/types', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, label, color, shape }),
    });
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail || '添加失败');
    }
    document.getElementById('type-name').value = '';
    document.getElementById('type-label').value = '';
    await loadTypes();
    renderTypesList();
    toast(`已添加自定义类型「${name}」`);
  } catch (err) {
    toast('添加类型失败：' + err.message, true);
  }
}

async function deleteType(name) {
  if (!confirm(`确定删除自定义类型「${name}」？`)) return;
  try {
    const res = await fetch(`/api/types/${encodeURIComponent(name)}`, { method: 'DELETE' });
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail || '删除失败');
    }
    await loadTypes();
    renderTypesList();
    toast(`已删除类型「${name}」`);
  } catch (err) {
    toast('删除类型失败：' + err.message, true);
  }
}

/* ============================================================
 * 编辑实体
 * ============================================================ */
function openEditNode(nodeData) {
  editingNodeId = nodeData.id;
  document.getElementById('modal-node-title').textContent = '✎ 编辑实体';
  const idInput = document.getElementById('node-id');
  idInput.value = nodeData.id;
  idInput.disabled = true;
  document.getElementById('node-name').value = nodeData.name || '';
  document.getElementById('node-type').value = nodeData.type || '';
  document.getElementById('node-desc').value = nodeData.description || '';
  document.getElementById('node-props').value = JSON.stringify(nodeData.properties || {}, null, 2);
  document.getElementById('node-chunks').value = (nodeData.source_chunks || []).join('\n');
  openModal('modal-node');
}

loadBoards();
