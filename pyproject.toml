[project]
name = "onekiil4all"
version = "0.1.0"
description = "AI 智能助手 - 使用 LangChain + DeepSeek"
requires-python = ">=3.11,<4.0"
dependencies = [
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-core>=0.3.0",
    "requests>=2.31.0",
    "deepagents>=0.5.0",
    "fastapi>=0.135.2",
    "uvicorn>=0.42.0",
    "ddgs>=9.12.0",
    "python-dotenv>=1.0.0",
    "jieba>=0.42.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
